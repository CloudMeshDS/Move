name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: 'https://gqyvttttlrncbjnxcpzj.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_3rUQdsDgkaqezStIicO1Cw_EQt6I4j0'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Move-Logistics-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
